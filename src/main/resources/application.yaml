logging:
  file:
    path: logs
    name: ${logging.file.path}/mod-camunda.log
  level:
    com:
      zaxxer:
        hikari: INFO
    org:
      apache.kafka.clients: ERROR
      folio: INFO
      hibernate: INFO
      operaton: INFO
      operaton.bpm.engine.jobexecutor: ERROR
      springframework: INFO
      springframework.test: WARN

    # Enable logging of BPMN if activation fails.
    #org.folio.rest.operaeton.service.OperatonApiService: DEBUG

server:
  port: 8081
  servlet:
    context-path: /

spring:
  application.name: mod-camunda
  codec.max-in-memory-size: 16777216
  data.rest:
    returnBodyOnCreate: true
    returnBodyOnUpdate: true

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}

  main:
    allow-bean-definition-overriding: false
    allow-circular-references: false
    banner-mode: console
    log-startup-info: true

  servlet:
    encoding:
      charset: UTF-8
      enabled: true

  sql:
    init:
      #platform: h2
      platform: postgres

      #continue-on-error: false

  datasource:
    hikari:
      leakDetectionThreshold: 1800000
      connectionTimeout: 30000
      idleTimeout: 600000
      maxLifetime: 1800000
      maximumPoolSize: ${DB_MAXPOOLSIZE:16}
    #url: jdbc:h2:./target/mod-camunda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    #driverClassName: org.h2.Driver
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:mod_camunda}

    username: ${DB_USERNAME:folio_admin}
    password: ${DB_PASSWORD:folio_admin}

  flyway:
    enabled: false
    encoding: UTF-8

  h2:
    console:
      enabled: false
      path: /h2console
      settings:
        web-allow-others: true

  jpa:
    #database-platform: org.hibernate.dialect.H2Dialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    properties.hibernate:
      jdbc.lob.non_contextual_creation: true
      default_schema: ${DB_SCHEMA:mod_camunda}

    generate-ddl: false
    hibernate.ddl-auto: update
    #hibernate.hbm2ddl.auto: none
    open-in-view: true
    show-sql: false

  mail:
    default-encoding: UTF-8
    host: smtp-relay.tamu.edu
    username:
    password:
    port: 25
    properties.mail.smtp:
      auth: false
      starttls.enable: true
      ssl.checkserveridentity: true
    protocol: smtp
    test-connection: false

  profiles:
    active: default, messaging

  thymeleaf:
    mode: TEXT
    suffix: .sql

  # Set this to `camunda` to allow the admin ui (see `camunda.bpm.webapp.application-path`) along side the module descriptor paths.
  # This is relative to the context path.
  jersey.application-path: camunda

operaton:
  # see: https://docs.operaton.org/docs/documentation/user-guide/spring-boot-integration/
  bpm:
    webapp:
      application-path: ui
      session-cookie-path-enforcement: true
    auto-deployment-enabled: false
    database:
      schema-name:
      schema-update: false
      table-prefix:
      type: postgres
    filter:
      create: All Tasks
    admin-user:
      id: admin
      password: admin
      first-name: Camunda
      last-name: Admin
      email: admin@localhost
    # authorization.enabled: true
    default-number-of-retries: 1
    job-execution:
      enabled: true
      backoff-decrease-threshold: 100
      backoff-time-in-millis: 0
      core-pool-size: 3
      deployment-aware: false
      keep-alive-seconds: 0
      lock-time-in-millis: 3600000
      max-backoff: 0
      max-jobs-per-acquisition: 3
      max-pool-size: 10
      max-wait: 60000
      queue-capacity: 3
      wait-increase-factor: 2
      wait-time-in-millis: 15000
    # see: https://docs.camunda.org/manual/7.20/user-guide/spring-boot-integration/configuration/#generic-properties
    generic-properties:
      properties:
        enable-script-compilation: true
        enable-script-engine-nashorn-compatibility: true
        enable-fetch-script-engine-from-process-application: false
    metrics:
      enabled: false

   # Enable custom operaton health end point, see: https://docs.operaton.org/docs/documentation/reference/release-notes/2_1/#operaton-run--dedicated-health-endpoint .
   #run.health.rest-endpoint.enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  show-actuator: true
  swagger-ui:
    enabled: true
    path: /swagger-ui
  writer-with-default-pretty-printer: true

application:
  kafka:
    listener:
      events:
        concurrency: 1
        topic-pattern: ${ENV:folio}.(.*\.)?camunda.events
        group-id: ${ENV:folio}-mod-camunda-events-group

folio:
  delegate:
    database:
      connectionTimeout: 30000
      idleTimeout: 600000
      maxLifetime: 7200000 # 2 hours as default is 30 minutes.
      maxPoolSize: 8

  env:
    defaults:
      logLevel:
        name: logLevel
        type: literal
        value: INFO
      folioLoginPath:
        name: gatewayLoginPath
        type: url_path
        value: /authn/login-with-expiry
      folioPass:
        name: folioPass
        type: secure
        expose: false
      folioUser:
        name: folioUser
        type: literal
        expose: false
      gatewayUrl:
        name: gatewayUrl
        type: url
        value: http://localhost:9130
      folioAccessToken: # Value will be overridden.
        name: folioAccessToken
        type: secure
      folioAccessTokenExpire: # Value will be overridden.
        name: folioAccessTokenExpire
        type: literal
      folioRefreshToken: # Value will be overridden.
        name: folioRefreshToken
        type: secure
      folioRefreshTokenExpire: # Value will be overridden.
        name: folioRefreshTokenExpire
        type: literal

  gateway:
    loginPath: /authn/login-with-expiry
    tokenExpireOffset: 15
    url: ${OKAPI_URL:http://localhost:9130}

tenant:
  header-name: X-Okapi-Tenant
  force-tenant: false
  default-tenant: diku

  # When this and initialize-default-tenant are true, then if the database already exists, then it will be dropped and re-initialized.
  recreate-default-tenant: false
  initialize-default-tenant: true

  domain-packages:

  # https://github.com/camunda/camunda-bpm-platform/tree/master/engine/src/main/resources/org/camunda/bpm/engine/db/create
  # be sure to match datasource platform
  schema-scripts:
    - classpath:/org/operaton/bpm/engine/db/create/activiti.postgres.create.engine.sql
    - classpath:/org/operaton/bpm/engine/db/create/activiti.postgres.create.history.sql
    - classpath:/org/operaton/bpm/engine/db/create/activiti.postgres.create.identity.sql
    - classpath:/org/operaton/bpm/engine/db/create/activiti.postgres.create.case.engine.sql
    - classpath:/org/operaton/bpm/engine/db/create/activiti.postgres.create.case.history.sql
    - classpath:/org/operaton/bpm/engine/db/create/activiti.postgres.create.decision.engine.sql
    - classpath:/org/operaton/bpm/engine/db/create/activiti.postgres.create.decision.history.sql

  # H2 schema scripts.
  #schema-scripts:
  #  - classpath:/org/operaton/bpm/engine/db/create/activiti.h2.create.engine.sql
  #  - classpath:/org/operaton/bpm/engine/db/create/activiti.h2.create.history.sql
  #  - classpath:/org/operaton/bpm/engine/db/create/activiti.h2.create.identity.sql
  #  - classpath:/org/operaton/bpm/engine/db/create/activiti.h2.create.case.engine.sql
  #  - classpath:/org/operaton/bpm/engine/db/create/activiti.h2.create.case.history.sql
  #  - classpath:/org/operaton/bpm/engine/db/create/activiti.h2.create.decision.engine.sql
  #  - classpath:/org/operaton/bpm/engine/db/create/activiti.h2.create.decision.history.sql

# https://docs.spring.io/spring-boot/docs/current/reference/html/actuator.html
management:
  endpoints:
    access:
      default: none
    web:
      base-path: /admin
      exposure:
        include: flyway,health,info
  endpoint:
    flyway:
      enabled: true
    health:
      enabled: true
      show-details: always
      show-components: always
    info:
      enabled: true
  health:
    defaults:
      enabled: true
    readinessstate:
      enabled: true

    # Custom operaton health indicator (set this to false to disable spring-boot's and allow support operatons custom `operaton.run.health.rest-endpoint.enabled=true`), see https://docs.operaton.org/docs/documentation/reference/release-notes/2_1/#spring-boot-integration .
    #operaton.enabled: false
  info:
    env.enabled: true
    java.enabled: true
    os.enabled: true

error:
  handling:
    environment: DEV
    emailFrom: admin@localhost
    # comma seperated email addresses
    emailTo: admin@localhost

info:
  build:
    artifact: "@project.artifactId@"
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"
